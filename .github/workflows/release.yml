name: Release plugin
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version"
        required: true
        type: string
permissions:
  contents: write
jobs:
  native:
    uses: ./.github/workflows/build-native.yml
    with:
      source_ref: ${{ github.sha }}
  release:
    needs: native
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        shell: bash
        run: |
          VERSION="${{ inputs.version }}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then exit 1; fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=v${VERSION}" >> "${GITHUB_OUTPUT}"
          [[ "${VERSION}" == *-* ]] && echo "prerelease=true" >> "${GITHUB_OUTPUT}" || echo "prerelease=false" >> "${GITHUB_OUTPUT}"
      - name: Download platform wxscan extensions
        uses: actions/download-artifact@v4
        with:
          pattern: wxscan-*
          path: .native-artifacts
      - name: Bundle and verify wxscan extensions
        run: |
          python scripts/package_wxscan.py bundle --artifacts .native-artifacts --native native --require linux-x86_64 windows-x86_64 macos-x86_64 macos-aarch64
      - name: Build Registry artifact
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python scripts/build_registry_artifact.py "${VERSION}"
          echo "asset=attendance-${VERSION}.zip" >> "${GITHUB_OUTPUT}"
      - name: Verify checksum
        run: sha256sum -c "${{ steps.package.outputs.asset }}.sha256"
      - name: Verify native modules in Registry ZIP
        shell: python
        run: |
          import json, zipfile
          from pathlib import Path
          archive = next(Path(".").glob("attendance-*.zip"))
          with zipfile.ZipFile(archive) as z:
              data = json.loads(z.read("native/_manifest.json"))
              assert len(data["platforms"]) == 4
              for entry in data["platforms"].values():
                  assert "native/" + entry["file"] in z.namelist()
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          ASSET="${{ steps.package.outputs.asset }}"
          git tag "${TAG}" "${GITHUB_SHA}"
          git push origin "${TAG}"
          FLAGS=()
          [[ "${{ steps.version.outputs.prerelease }}" == "true" ]] && FLAGS+=(--prerelease)
          gh release create "${TAG}" "${ASSET}" "${ASSET}.sha256" --title "${TAG}" --generate-notes "${FLAGS[@]}"
