name: Publish beta
on:
  workflow_run:
    workflows: ["Test plugin"]
    types: [completed]
    branches: ["main"]
permissions:
  contents: write
  actions: read
jobs:
  beta:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Resolve beta version
        id: version
        shell: python
        run: |
          import json, os
          from pathlib import Path
          base = str(json.loads(Path("plugin.json").read_text())["version"]).split("-", 1)[0]
          beta = f"{base}-beta.{os.environ['GITHUB_RUN_NUMBER']}"
          with Path(os.environ["GITHUB_OUTPUT"]).open("a") as out:
              out.write(f"version={beta}\n")
              out.write(f"tag=v{beta}\n")
      - name: Download platform wxscan extensions
        uses: actions/download-artifact@v4
        with:
          pattern: wxscan-*
          path: .native-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - name: Bundle and verify wxscan extensions
        run: |
          python scripts/package_wxscan.py bundle --artifacts .native-artifacts --native native --require linux-x86_64 windows-x86_64 macos-x86_64 macos-aarch64
      - name: Build Registry artifact
        id: package
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          python scripts/build_registry_artifact.py "${VERSION}"
          echo "asset=attendance-${VERSION}.zip" >> "${GITHUB_OUTPUT}"
      - name: Verify checksum
        run: sha256sum -c "${{ steps.package.outputs.asset }}.sha256"
      - name: Verify native modules in Registry ZIP
        shell: python
        run: |
          import json, zipfile
          from pathlib import Path
          archive = next(Path(".").glob("attendance-*.zip"))
          with zipfile.ZipFile(archive) as z:
              data = json.loads(z.read("native/_manifest.json"))
              assert len(data["platforms"]) == 4
              for entry in data["platforms"].values():
                  assert "native/" + entry["file"] in z.namelist()
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          SHA="${{ github.event.workflow_run.head_sha }}"
          ASSET="${{ steps.package.outputs.asset }}"
          git tag "${TAG}" "${SHA}"
          git push origin "${TAG}"
          gh release create "${TAG}" "${ASSET}" "${ASSET}.sha256" --target "${SHA}" --title "${TAG}" --generate-notes --prerelease
